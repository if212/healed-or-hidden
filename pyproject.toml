[project]
name = "hoh"
version = "0.1.0"
description = "Harness and analysis code for the Healed-or-Hidden study of coding agents acting as E2E test healers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "numpy>=2.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "playwright==1.60.0",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hoh", "src/hoh_runner", "src/pwrun"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["third_party", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
