# The validation run of stage 1b: B-remove and C-rename on the tests that have a target in the
# rules file (design doc 5.3 and 5.10). The rules file named below holds the reviewed targets,
# checked against page snapshots of every step (scenarios/rename/notes.md, section 7).
#
#   just fixes                                           # look at the reference fixes first
#   uv run python -m hoh.validate --config stages/validate-1b.yaml --only bookstack/comment
#   uv run python -m hoh.validate --config stages/validate-1b.yaml
#
# Per test and run: B-remove runs the generated test on A and on A+R; C-rename runs the
# reference fix on A+C and on A+C+M (the shadow oracle after the A+C+M run) and the generated
# test on A+C and on A+C+M (the oracle again, its result classified against the fix's). With
# 38 tests and 3 runs that is 228 + 456 = 684 runs, 6 at once. The reference fixes are made
# here from the rules file into reference_fixes_root, as missing generated tests are.
#
# On A+R a run stops at the first failing line and never reaches the pages after it, so this
# run does not show what a removal leaves there (the empty breadcrumb item on Invoice Ninja's
# list pages): after the smoke run of one test and before the full run, capture and look at the
# list pages of the affected tests under A+R once (scenarios/rename/notes.md, section 7, item 10).
#
# The output directory is not the 1a one: a validation rewrites baseline.json for the
# scenarios of its own configuration only. A 1b stage takes
# `baseline: results/validation-1b/baseline.json`, `initial_results:
# results/validation-1b/initial` and the same `rules`.
#
# Every key is listed; unknown keys are refused. Relative paths are relative to the repository
# root. Build the images and run `just neutralize` first (stages/validate.yaml says how):
# A+C+M carries the benchmark's change.

families:                  # family -> app -> [task, ...]: every test with a target
  b_remove: &targets
    bookstack: [comment, count_recently_created_books, count_recently_created_pages,
                create_book, create_page, create_sort_rule, delete_book, favourite_book,
                recent_activity_all, recently_viewed_book, recently_viewed_chapter, search,
                settings, unfavourite_shelf, update_book]
    invoiceninja: [approve_quote, convert_quote_to_invoice, create_invoice, create_product,
                   delete_expired_quote, delete_payment, disable_invoices_module, enter_payment,
                   expired_quotes, localization, mark_invoice_as_paid,
                   mark_past_due_invoice_as_paid, past_due_invoices, recent_payments,
                   recent_transactions_expenses, settings, stop_recurring_invoice,
                   upcoming_invoices, upcoming_quotes, upcoming_recurring_invoices,
                   view_invoice_details, view_products, view_quote_details]
  c_rename: *targets

# Per test, the control C-rename renames and B-remove removes (hoh.rules). The backend of
# each run is given this file; do not repeat it under backend.options.
rules: scenarios/rename/rules.yaml
reference_fixes_root: build/reference_fixes   # <root>/<app>/test_<task>.py, never committed

repeats: 3                 # runs per check (--repeats overrides)
slots: 6                   # runs at once, one stack each (--slots overrides)

backend:                   # as in stages/validate.yaml
  factory: hoh.docker_backend:DockerBackend
  options:
    stacks_root: /Users/Shared/hoh-val         # never the sessions' stacks root
    slot: "{slot}"
    project_prefix: hohv

output_dir: results/validation-1b   # ignored by git; not the 1a directory
tests_root: build/tests
selection: scenarios/selection.json
